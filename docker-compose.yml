version: "3.8"

services:
  finance-bot:
    build: .
    image: finance-bot:latest
    container_name: finance-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge
